# Cấu hình Luna TV. Mỗi màn hình là một tiến trình Chromium riêng, chạy ngoài
# JVM của server, nên một trang web bị treo không kéo theo cả máy chủ.

render:
  # Số khung hình mỗi giây đẩy lên bản đồ (1-30). Trang tĩnh gần như không tốn gì:
  # chỉ khung nào thực sự đổi mới được gửi đi.
  fps: 20
  # Giới hạn băng thông gửi hình cho mỗi màn hình (megabit/giây). Video trên màn
  # hình lớn thay đổi gần hết các bản đồ mỗi khung: không giới hạn thì kết nối
  # của người xem nghẽn và màn hình trắng trơn. Vượt ngân sách thì bỏ khung,
  # hình vẫn liền mạch nhưng ít khung hình hơn. Đặt theo đường truyền người xem.
  max-megabits: 36
  # Chất lượng JPEG Chromium dùng khi gửi khung hình (1-100). Bản đồ chỉ có 143 màu
  # nên với tường bản đồ, trên 70 gần như không thấy khác biệt; nhưng mod client
  # xem thẳng chính khung JPEG này, nên ở đó chất lượng thấy rõ. Đổi lại là băng
  # thông: ở 1664x896, chất lượng 60 cho khung ~150 KB, tăng lên 85 thì khung
  # khoảng gấp đôi. Nếu người xem ở xa, hãy hạ stream.fps hoặc đặt
  # stream.max-megabits thay vì hạ chất lượng.
  quality: 85
  # Độ sáng ảnh mặc định cho màn hình mới, tính theo phần trăm (100 = nguyên bản).
  # Bảng màu bản đồ chỉ có 143 màu và dải rất hẹp, nên cảnh tối bị mất chi tiết
  # sau khi đổi màu; kéo sáng trước khi đổi sẽ giữ lại được. Áp dụng bằng đường
  # cong gamma nên vùng sáng không bị cháy trắng. Chỉnh riêng từng màn hình bằng
  # /lunatv brightness hoặc GUI.
  brightness: 100
  # Độ phân giải mặc định cho MÀN HÌNH MỚI (mỗi màn hình chỉnh riêng được bằng
  # /lunatv scale hoặc GUI): 1 = trang chạy đúng kích thước tường, nét nhất;
  # 2-4 = trang chạy ở 1/2-1/4 kích thước rồi phóng to lại, nhẹ máy hơn nhiều
  # (video tự chọn chất lượng thấp hơn, mã hoá JPEG rẻ hơn theo bình phương).
  capture-scale: 1
  # Lưu ý cho mod phía client: scale 1 nghĩa là khung hình đúng bằng lưới bản đồ
  # (số bản đồ ngang x 128), tức là nét 1:1 trên tường. Đặt lớn hơn 1 sẽ tiết
  # kiệm băng thông nhưng client phải phóng to nên hình mờ hơn; đường luồng
  # không giải mã khung hình nên scale không còn giúp giảm CPU như trước.
  # Gói toàn bộ khung hình vào một packet bundle để tránh xé hình giữa các bản
  # đồ. Mặc định tắt: qua Velocity của cluster này, dữ liệu bản đồ trong bundle
  # không bao giờ tới client (đã kiểm chứng 2026-08-21) - màn hình trắng trơn.
  bundling: false
  # Thuật toán chuyển màu sang bảng màu bản đồ:
  #   DIRECT          - lấy màu gần nhất, mặt phẳng sạch, chữ rõ.
  #   ORDERED         - tán màu nhanh (Bayer 8x8) ngay trong bước giải mã khung
  #                     hình, chuyển sắc mượt hơn DIRECT mà gần như không tốn
  #                     thêm CPU. Mặc định.
  #   FLOYD_STEINBERG - tán màu khuếch tán lỗi của MapEngine, mượt nhất nhưng
  #                     tốn CPU hơn rất nhiều (đo được ~1.5 lõi trên tường 12x6).
  converter: ORDERED
  # Hoa văn cho chế độ ORDERED (chung cho mọi màn hình):
  #   bayer - ma trận Bayer 8x8 cổ điển, hoa văn lưới caro đều.
  #   a1/a2 - "a dither" (pippin.gimp.org/a_dither) dạng xor, nhiễu như vân.
  #   a3/a4 - "a dither" dạng cộng, mịn hơn; a2/a4 lệch riêng từng kênh màu,
  #           chi tiết hơn nhưng có chút nhiễu màu. Mặc định a4.
  ordered-pattern: a4
  # Khoảng cách người chơi bắt đầu nhìn thấy màn hình (block). Màn hình lớn nên
  # đặt xa hơn: phải đứng lùi mới thấy hết, và ra khỏi bán kính này là mất hình.
  spawn-distance: 64
  # Khoảng cách tối đa để bấm được vào màn hình (block). Màn hình lớn cần đứng xa
  # mới thấy hết, nên giá trị này phải đủ lớn: bấm từ ngoài bán kính sẽ không ăn.
  interact-distance: 64

screens:
  # Số màn hình tối đa. Mỗi màn hình là một Chromium riêng và tốn khoảng 400-450MB
  # RAM thật (đo trên máy này với trang có hoạt ảnh), nằm ngoài heap của server.
  # Tăng lên chỉ khi máy còn dư RAM: kiểm tra bằng `free -m` trước.
  max: 2
  # Trang mở sẵn khi tạo màn hình mới.
  homepage: "https://www.google.com"
  # Các trang bấm nhanh trong bảng điều khiển.
  presets:
    - name: YouTube
      url: "https://www.youtube.com"
    - name: Google
      url: "https://www.google.com"

browser:
  # Đường dẫn Chromium. Bản snap không đọc được file:// nên chỉ dùng http(s).
  executable: "/snap/bin/chromium"
  # User agent trình duyệt khai với trang web. Headless bị nhiều trang coi là bot
  # (YouTube từ chối phát video), nên khai như một Chrome bình thường. Để trống
  # thì dùng chuỗi gốc của trình duyệt, chỉ bỏ chữ "Headless".
  user-agent: "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/151.0.0.0 Safari/537.36"
  # Cổng CDP cấp cho màn hình đầu tiên; các màn hình sau lấy cổng trống kế tiếp.
  # Chỉ nghe trên 127.0.0.1, không mở ra ngoài.
  debug-port-start: 39330
  # Số giây chờ Chromium mở cổng CDP trước khi coi là lỗi.
  startup-timeout: 20
  # Tham số dòng lệnh thêm vào Chromium.
  switches:
    - "--headless=new"
    - "--no-sandbox"
    - "--disable-gpu"
    # Không có GPU thật thì compositing và WebGL đều chạy bằng SwiftShader trên
    # CPU. Một trang nặng hiệu ứng (TikTok) từng đốt 6 lõi chỉ để vẽ 60fps mà
    # tường bản đồ không bao giờ hiển thị nổi. Tắt WebGL: trang 3D sẽ tự hạ cấp.
    - "--disable-gpu-compositing"
    - "--disable-gpu-vsync"
    - "--disable-webgl"
    - "--autoplay-policy=no-user-gesture-required"
    - "--disable-background-timer-throttling"
    - "--disable-backgrounding-occluded-windows"
    - "--disable-renderer-backgrounding"
    - "--disable-dev-shm-usage"

input:
  # Giữ Shift rồi lăn chuột sẽ cuộn trang tại chỗ đang nhìn (không giữ Shift
  # thì lăn chuột đổi ô đồ như bình thường).
  # Số pixel cuộn cho mỗi nấc lăn; 120 là mức một trình duyệt để bàn hay dùng.
  scroll-step: 120
  # Đảo chiều lăn, nếu thấy cuộn ngược với mong đợi.
  invert-scroll: false

# Luồng hình cho mod phía client (không đi qua kết nối Minecraft, nên không
# ảnh hưởng ping). Khung hình JPEG của Chromium được chuyển thẳng, không giải mã
# lại, nên gần như không tốn CPU.
stream:
  enabled: true
  # Kiểu nén cho mod client: h264 hoặc mjpeg.
  #
  # h264 (mặc định) cần ffmpeg trên máy chủ; không có thì tự quay về mjpeg và
  # ghi một dòng cảnh báo lúc khởi động. Khác biệt không nhỏ: mjpeg gửi trọn
  # một tấm ảnh mỗi khung, ở 1664x896 chất lượng 85 là khoảng 1 MB, nên 30 khung
  # một giây đòi 240 Mbit/s cho MỖI người xem. h264 mô tả phần thay đổi so với
  # khung trước nên cùng kích thước đó chỉ tốn vài Mbit/s.
  codec: h264
  # Trần bitrate cho h264 (kbit/s). Đây là trần thật, do bộ mã hoá tự ép vào,
  # chứ không phải bỏ khung như bên mjpeg. Mỗi màn hình đặt riêng được bằng
  # /lunatv streamlimit (Mbit/s) hoặc GUI.
  bitrate: 6000
  # Lệnh ffmpeg dùng để mã hoá. Để nguyên nếu ffmpeg đã có trong PATH.
  ffmpeg: "ffmpeg"
  # Mã hoá bằng iGPU qua VA-API: auto (thử /dev/dri/renderD128 lúc khởi động,
  # hỏng thì tự về CPU), off, hoặc đường dẫn render node cụ thể. Trên máy này
  # cần gói intel-media-va-driver-non-free; đo được rẻ hơn CPU khoảng 7 lần.
  vaapi: auto
  # Địa chỉ lắng nghe trên máy chủ.
  host: 0.0.0.0
  port: 8340
  # Địa chỉ mà người chơi kết nối tới (thường qua tên miền/reverse proxy).
  # Để trống thì dùng host:port ở trên.
  public-url: ""
  # Số người xem tối đa cho mỗi màn hình.
  max-viewers: 16
  # Mức TRẦN khung hình cho mod client; tốc độ thật theo nội dung trang (video
  # 30fps cho ra 30fps dù trần là 60). Tách hẳn khỏi render.fps: đường bản đồ
  # bị giới hạn bởi kết nối game, còn luồng này đi socket riêng nên chạy nhanh
  # hơn được. Trình duyệt sẽ chụp ở mức cao nhất trong hai bên.
  fps: 30
  # Trần băng thông cho MỖI người xem luồng (Mbit/s). Khác với
  # render.max-megabits, vốn chỉ áp cho đường bản đồ.
  #
  # Đừng đặt 0 (không giới hạn) trừ khi mọi người xem đều ở trong LAN. Mỗi khung
  # hình là một ảnh JPEG trọn vẹn: ở 1664x896 chất lượng 85 là khoảng 1 MB, nên
  # stream.fps 30 đòi tới 240 Mbit/s cho MỖI người. Đường truyền không tải nổi
  # thì máy chủ không bỏ khung mà nằm chờ ghi xong khung đang gửi, đệm socket
  # đầy lên, và người xem thấy hình đứng hẳn chứ không phải chậm đi. Có trần thì
  # khung vượt ngân sách bị bỏ TRƯỚC khi ghi, hình ít khung hơn nhưng luôn chạy.
  #
  # Muốn nét hơn ở cùng một trần: hạ render.quality hoặc tăng render.capture-scale
  # để khung hình nhẹ đi, chứ không phải nâng trần.
  max-megabits: 25

audio:
  enabled: true
  # Tiền tố tên null-sink PulseAudio; mỗi màn hình có một sink riêng.
  sink-prefix: "lunatv"
  pactl-path: "pactl"
  parec-path: "parec"
  # Bán kính nghe được tiếng của màn hình (block). Đây là mức mặc định; mỗi màn
  # hình đặt riêng được bằng /lunatv range hoặc GUI, và số đó áp cho cả voice
  # chat lẫn mod client nên tiếng tắt hẳn ở cùng một khoảng cách với mọi người.
  distance: 24.0
  # Bitrate Opus (bit/s). Simple Voice Chat tự dựng bộ mã hoá ở mức mặc định
  # của Opus (khoảng 51 kbps mono) kèm FEC cho micro, quá thấp cho nhạc. Đặt 0
  # để dùng lại bộ mã hoá của voice chat.
  bitrate: 128000
  # Giữ lại null-sink khi plugin tắt. Bật lên nếu PulseAudio hay bị dọn sink.
  keep-sinks-on-disable: false

logging:
  debug: false
