name: LunaVaultBackend
version: ${version}
main: dev.belikhun.luna.vault.backend.LunaVaultBackendPlugin
api-version: '1.21'
description: Backend Vault bridge for Luna network economy.
authors:
  - Belikhun
permissions:
  lunavault.transactions:
    default: op
    description: Xem lịch sử giao dịch Luna Vault.
  lunavault.admin:
    default: op
    description: Kiểm tra và thử nghiệm kết nối kinh tế từ backend.
commands:
  transactions:
    description: Xem lịch sử giao dịch Luna Vault.
    usage: /transactions [trang]
    aliases: [txns, lichsu]
  lunavault:
    description: Trạng thái, số dư và bài thử tải của LunaVault trên backend này.
    usage: /lunavault <status|balance|deposit|withdraw|transfer|history|stress|overdraw>
dependencies:
  server:
    LunaCore:
      load: BEFORE
      required: true
      join-classpath: true
    Vault:
      load: BEFORE
      required: true
    HuskHomes:
      load: AFTER
      required: false
    PlaceholderAPI:
      load: BEFORE
      required: false
