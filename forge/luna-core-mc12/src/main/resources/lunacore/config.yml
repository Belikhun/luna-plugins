# LunaCore - Minecraft 1.12.2 Forge backend
#
# The resource path is scoped by mod id on purpose. Every mod loader shares one class
# loader, so a bundled default at a bare "config.yml" resolves to whichever luna jar
# happens to come first - which is exactly how four mods on one server once ended up
# reading LunaCore's defaults into their own directories.

logging:
  # ANSI colour in log lines. Forge 1.12.2 writes latest.log through log4j with no
  # escape filtering, so leaving this on puts control characters in the archived file
  # that luna later reads back.
  ansi: false
  level: INFO
  pluginMessaging:
    enabled: false
  heartbeatTransport:
    enabled: false

heartbeat:
  enabled: true
  # The proxy's LunaCore HTTP API. The backend derives every sibling endpoint it
  # needs (the registry stream, the selector layout, the messaging config) from this
  # one address, so there is nothing else to configure.
  endpoint: "http://127.0.0.1:32452/api/heartbeat"
  # Blank means the proxy names this server; it answers with the row it holds. Set it
  # only when this backend must announce a name the proxy does not already know.
  serverName: ""
  intervalSeconds: 5
  connectTimeoutMillis: 3000
  readTimeoutMillis: 3000
  streamEnabled: true

network:
  # How long a player may leave a keepalive unanswered before the server drops them
  # with "Timed out".
  #
  # Minecraft 1.12.2 compiles this deadline in at 15 seconds and exposes no key for
  # it; -Dfml.readTimeout covers the netty read timeout, which is a separate and much
  # longer one. Fifteen seconds is easily overrun on a heavy modpack by a client that
  # freezes building chunks or pauses for a long GC, and that player is disconnected
  # while still perfectly connected. LunaCore holds the deadline open this long
  # instead, then lets vanilla drop the connection.
  #
  # 15 or lower leaves vanilla to it and LunaCore does nothing. The default matches
  # the -Dpaper.playerconnection.keepalive=300 the Paper backends run with, so a
  # player gets the same tolerance wherever they are on the cluster.
  #
  # Raising it past 300 needs -Dfml.readTimeout raised to match (it is 300 on luna's
  # forge-legacy profile): that timeout counts any inbound traffic at all, is measured
  # separately, and a stalled client sends nothing - so it, not this key, is what
  # decides the moment anything above its value would have mattered.
  keepaliveTimeoutSeconds: 300

# Shared with every other luna backend, key for key, so a Paper plugin and this mod
# pointed at the same database connect the same way. Off by default: a backend that
# needs it says so, and one that does not should never open a socket for it.
#
# The MariaDB driver ships inside this jar - no mod loader fetches one at boot - so
# `type: mariadb` needs nothing installed. The features that use it degrade rather
# than fail when this is off: LunaShop keeps trading and simply records no history.
database:
  enabled: false
  type: "mariadb"
  host: "127.0.0.1"
  port: 3306
  name: "luna"
  username: "root"
  password: ""
  options:
    useSSL: false
    serverTimezone: "UTC"
