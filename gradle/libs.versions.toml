# This file was generated by the Gradle 'init' task.
# https://docs.gradle.org/current/userguide/version_catalogs.html#sec::toml-dependencies-format

[versions]
paper = "1.21.10-R0.1-SNAPSHOT"
adventure = "4.17.0"
vault = "1.7.1"
mariadb = "3.4.1"
mysql = "9.1.0"
sqlite = "3.47.2.0"
velocity = "3.5.0-SNAPSHOT"
moddevgradle = "2.0.74"
neoforge = "21.1.172"
# Classic forge, one entry per game line luna builds for. Both are the recommended
# build of their line; moddevgradle's legacyforge plugin drives them the same way it
# drives neoforge, reobfuscating mojmap sources to SRG on the way into the jar.
forge201 = "1.20.1-47.4.0"
forge192 = "1.19.2-43.5.0"
# The 1.12.2 line, which moddevgradle cannot drive: that era is legacy FML on
# LaunchWrapper with MCP names, not ModLauncher with mojmap. RetroFuturaGradle
# builds it instead, against MCP `stable` 39 - the last mapping published for
# 1.12.2, and the one every mod of that era is compiled against.
#
# There is deliberately no forge version here. RFG derives it from mcVersion and
# exposes it as a read-only Provider, so it compiles against 14.23.5.2847 and that
# is not ours to choose. It does not need to be: Forge froze its 1.12.2 API years
# before the last build, so a mod compiled against 2847 loads on the 2859 the
# installer actually lays down.
retrofuturagradle = "2.0.3"
mcp112channel = "stable"
mcp112version = "39"
# newest loom that still targets this repo's gradle (1.16+ requires gradle 9.4+)
fabricloom = "1.15.5"
# Compile target for the fabric module. One jar serves 1.20 upward, so this is
# the version its *stable* API surface is checked against, not a support floor;
# everything that changed across that range goes through core/fabric/compat.
fabricminecraft = "1.21.1"
fabricloader = "0.16.14"
fabricapi = "0.116.15+1.21.1"
# The 26.x line ships unobfuscated, so fabric publishes an empty intermediary and
# an intermediary-remapped jar cannot run there. luna-core-mc26-fabric builds the
# same sources a second time against these coordinates and ships them unremapped.
fabricminecraft26 = "26.2"
# sha1 of that version's server bundle, which is also its download URL's last path
# segment; bumping the version above without this one fails the build's own check
fabricminecraft26sha1 = "823e2250d24b3ddac457a60c92a6a941943fcd6a"
fabricloader26 = "0.19.3"
fabricapi26 = "0.156.0+26.2"
jda = "5.6.1"
miniplaceholders = "3.1.0"
placeholderapi = "2.12.2"
luckperms = "5.4"
skinsrestorer = "15.11.0"
interactivechat = "4.3.5.1"
huskhomes = "4.10"
spark = "0.1-SNAPSHOT"
asm = "9.8"
rabbitmq = "5.24.0"
# only the 1.12.2 messaging mod needs this: amqp-client logs through slf4j and that
# platform, unlike every modern one, ships no slf4j of its own
slf4j = "2.0.16"
tab = "5.5.0"
forgeplaceholderapi = "2.1.0"
voicechatapi = "2.6.13"
# MapEngine renders images onto map walls by packet, and is what luna-tv draws through.
mapengine = "1.8.12"
# The mixin fork fabric ships. Only the no-loom 26.x builds name it: loom puts the
# same artifact on the classpath itself for every 1.21 module.
spongemixin = "0.15.5+mixin.0.8.7"

[libraries]
paper-api = { module = "io.papermc.paper:paper-api", version.ref = "paper" }
adventure-minimessage = { module = "net.kyori:adventure-text-minimessage", version.ref = "adventure" }
adventure-serializer-legacy = { module = "net.kyori:adventure-text-serializer-legacy", version.ref = "adventure" }
adventure-serializer-gson = { module = "net.kyori:adventure-text-serializer-gson", version.ref = "adventure" }
vault-api = { module = "com.github.MilkBowl:VaultAPI", version.ref = "vault" }
mariadb-jdbc = { module = "org.mariadb.jdbc:mariadb-java-client", version.ref = "mariadb" }
mysql-jdbc = { module = "com.mysql:mysql-connector-j", version.ref = "mysql" }
sqlite-jdbc = { module = "org.xerial:sqlite-jdbc", version.ref = "sqlite" }
velocity-api = { module = "com.velocitypowered:velocity-api", version.ref = "velocity" }
neoforge = { module = "net.neoforged:neoforge", version.ref = "neoforge" }
jda = { module = "net.dv8tion:JDA", version.ref = "jda" }
miniplaceholders-api = { module = "io.github.miniplaceholders:miniplaceholders-api", version.ref = "miniplaceholders" }
placeholderapi = { module = "me.clip:placeholderapi", version.ref = "placeholderapi" }
luckperms-api = { module = "net.luckperms:api", version.ref = "luckperms" }
skinsrestorer-api = { module = "net.skinsrestorer:skinsrestorer-api", version.ref = "skinsrestorer" }
interactivechat-api = { module = "com.loohp:InteractiveChat", version.ref = "interactivechat" }
huskhomes-bukkit = { module = "net.william278.huskhomes:huskhomes-bukkit", version.ref = "huskhomes" }
spark-api = { module = "me.lucko:spark-api", version.ref = "spark" }
asm-tree = { module = "org.ow2.asm:asm-tree", version.ref = "asm" }
rabbitmq-client = { module = "com.rabbitmq:amqp-client", version.ref = "rabbitmq" }
tab-api = { module = "com.github.NEZNAMY:TAB-API", version.ref = "tab" }
forgeplaceholderapi-neoforge = { module = "com.envyful.papi:neo21", version.ref = "forgeplaceholderapi" }
voicechat-api = { module = "de.maxhenkel.voicechat:voicechat-api", version.ref = "voicechatapi" }
mapengine-api = { module = "de.pianoman911:mapengine-api", version.ref = "mapengine" }
sponge-mixin = { module = "net.fabricmc:sponge-mixin", version.ref = "spongemixin" }

[plugins]
moddevgradle = { id = "net.neoforged.moddev", version.ref = "moddevgradle" }
moddevgradle-legacy = { id = "net.neoforged.moddev.legacyforge", version.ref = "moddevgradle" }
retrofuturagradle = { id = "com.gtnewhorizons.retrofuturagradle", version.ref = "retrofuturagradle" }
fabricloom = { id = "fabric-loom", version.ref = "fabricloom" }
